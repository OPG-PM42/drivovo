<div class="images-header">
  <strong>Images</strong>
  <button
    tuiButton
    appearance="outline"
    iconStart="@tui.plus"
    size="s"
    type="button"
    (click)="addRow.emit()"
  >
    Add image
  </button>
</div>
@for (group of formArray().controls; track $index) {
  <div class="image-row" [formGroup]="group">
    <tui-textfield class="url-field">
      <label tuiLabel>URL</label>
      <input tuiTextfield formControlName="url" />
    </tui-textfield>
    <tui-textfield>
      <label tuiLabel>Alt</label>
      <input tuiTextfield formControlName="alt" />
    </tui-textfield>
    <tui-textfield class="small-field">
      <label tuiLabel>W</label>
      <input tuiTextfield type="number" formControlName="width" />
    </tui-textfield>
    <tui-textfield class="small-field">
      <label tuiLabel>H</label>
      <input tuiTextfield type="number" formControlName="height" />
    </tui-textfield>
    <button
      tuiIconButton
      iconStart="@tui.trash"
      appearance="flat"
      type="button"
      (click)="formArray().removeAt($index)"
    ></button>
  </div>
}
