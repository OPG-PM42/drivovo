<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Drivovo Admin</h1>
    <tui-loader [loading]="loading()" [overlay]="true">
      <form tuiForm="m" [formGroup]="form" (ngSubmit)="onSubmit()">
        <tui-textfield class="full-width">
          <label tuiLabel>Email</label>
          <input tuiTextfield type="email" formControlName="email" autocomplete="email" />
        </tui-textfield>
        <tui-error formControlName="email" />

        <tui-textfield class="full-width">
          <label tuiLabel>Password</label>
          <input tuiTextfield type="password" formControlName="password" autocomplete="current-password" />
        </tui-textfield>
        <tui-error formControlName="password" />

        @if (errorMessage()) {
          <p class="error-message">{{ errorMessage() }}</p>
        }

        <button
          tuiButton
          type="submit"
          appearance="primary"
          class="full-width submit-button"
          [disabled]="loading()"
        >
          Sign In
        </button>
      </form>
    </tui-loader>
  </div>
</div>
