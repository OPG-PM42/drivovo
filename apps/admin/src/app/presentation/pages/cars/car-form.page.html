<div class="page-header">
  <h1>{{ isEdit ? 'Edit Car' : 'New Car' }}</h1>
</div>

@if (loadingCar()) {
  <tui-loader [overlay]="true" [loading]="true">
    <div class="loading-placeholder"></div>
  </tui-loader>
} @else {
  <tui-loader [overlay]="true" [loading]="saving()">
    <form tuiForm="m" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <tui-textfield>
          <label tuiLabel>Name</label>
          <input tuiTextfield formControlName="name" />
        </tui-textfield>
        <tui-error formControlName="name" />

        <tui-textfield>
          <label tuiLabel>Brand</label>
          <input tuiTextfield formControlName="brand" />
        </tui-textfield>
        <tui-error formControlName="brand" />

        <tui-textfield class="full-width">
          <label tuiLabel>Description</label>
          <textarea tuiTextarea formControlName="description" rows="3"></textarea>
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Drive Type</label>
          <select tuiSelect formControlName="driveType" [items]="driveTypes"></select>
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Car Type</label>
          <select tuiSelect formControlName="type" [items]="carTypes"></select>
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Status</label>
          <select tuiSelect formControlName="status" [items]="statuses"></select>
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Engine Type</label>
          <select tuiSelect formControlName="engineType" [items]="engineTypes"></select>
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Engine Capacity</label>
          <input tuiTextfield formControlName="engineCapacity" placeholder="e.g. 2.0L" />
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Fuel Consumption</label>
          <input tuiTextfield formControlName="engineFuelCons" placeholder="e.g. 7.5L/100km" />
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Color</label>
          <input tuiTextfield formControlName="color" />
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Interior Trim</label>
          <input tuiTextfield formControlName="interiorTrim" />
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Power</label>
          <input tuiTextfield formControlName="power" placeholder="e.g. 150hp" />
        </tui-textfield>

        <tui-textfield>
          <label tuiLabel>Acceleration (0-100)</label>
          <input tuiTextfield formControlName="acceleration" placeholder="e.g. 8.5s" />
        </tui-textfield>

        <tui-textfield class="full-width">
          <label tuiLabel>URL</label>
          <input tuiTextfield formControlName="url" />
        </tui-textfield>
      </div>

      <app-image-array-editor
        [formArray]="imagesArray"
        (addRow)="addImage()"
      />

      @if (apiError()) {
        <p class="error-message">{{ apiError() }}</p>
      }

      <div class="form-actions">
        <button tuiButton type="button" appearance="outline" (click)="router.navigate(['/cars'])">
          Cancel
        </button>
        <button tuiButton type="submit" appearance="primary" [disabled]="saving()">
          Save
        </button>
      </div>
    </form>
  </tui-loader>
}
