services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-drivovo}:${POSTGRES_PASSWORD:-drivovo_dev}@db:5432/${POSTGRES_DB:-drivovo}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: deploy/docker/admin.Dockerfile
    ports:
      - "${ADMIN_PORT:-4200}:80"
    depends_on:
      - backend
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drivovo}
      POSTGRES_USER: ${POSTGRES_USER:-drivovo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drivovo_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/backend/src/utils/seed/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drivovo}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
